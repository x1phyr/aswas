name: Bug report
description: Report reproducible incorrect behavior in aswas.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve aswas. Remove usernames and private filesystem paths before submitting.
  - type: input
    id: version
    attributes:
      label: aswas version or commit
      placeholder: main at abc1234
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.5
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use placeholder paths and workspace names where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: finder_mutation
    attributes:
      label: Did this unexpectedly close or move Finder windows?
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private paths, account identifiers, tokens, and workspace data.
          required: true
